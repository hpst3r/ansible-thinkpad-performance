---
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Run apu-tune
  become: true
  ansible.builtin.systemd_service:
    name: apu-tune.service
    state: started

- name: Restart apu-tune timer
  become: true
  ansible.builtin.systemd_service:
    name: apu-tune.timer
    state: restarted

- name: Restart tpfand
  become: true
  ansible.builtin.systemd_service:
    name: tpfand.service
    state: restarted
  when: "thinkpad_performance_tpfand_enabled"
